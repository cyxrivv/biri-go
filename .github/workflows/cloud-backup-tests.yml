name: Cloud backup tests

on:
  push:
    branches:
      - feature/cloud-backup-restore
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask mysql-connector-python cryptography certifi vercel
      - name: Compile changed Python files
        run: |
          python -m py_compile api/index.py system/backend/cloud_backup.py system/backend/routes/admin.py system/backend/config.py system/backend/db.py system/backend/main.py
      - name: Run cloud backup unit tests
        run: python -m unittest discover -s system/backend/tests -v
